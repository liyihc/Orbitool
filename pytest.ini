# pytest.ini
[pytest]
# Keep a passing run silent: no application log records reach the console.
# pytest still captures them, so a failing test prints its logs and traceback in
# the report as usual.  Tests that deliberately log an error (the ui_task error
# contract) pass, so their records stay hidden too.  logger.py detects pytest and
# skips the file handler, so a test run never writes the log.txt a user sends to
# support; the WARNING-and-above trail goes to the file below, so a passing test
# that still logged something odd can be found after the run.
log_cli = false
log_file = .pytest_cache/orbitool-tests.log
log_file_level = WARNING
# Treat every warning as a failure; the one exception is matplotlib's Qt backend
# reading a Qt enum that PySide6 has deprecated (high-DPI is always on in Qt6, so
# the value is unused; the message names `Qt::ApplicationAttribute`, whose colons
# cannot appear in a filter field, so the ignore is scoped by module).  The last
# matching filter wins, so the `ignore` must come after `error`.
filterwarnings =
    error
    ignore::DeprecationWarning:matplotlib.backends.backend_qt
testpaths = 
    Orbitool/base/tests
    ;; Orbitool/UI/tests 
    Orbitool/UI/tests/test_timeseries_restore.py
    Orbitool/UI/tests/test_noise_damage_report.py
    Orbitool/UI/tests/test_workspace_open.py
    Orbitool/UI/tests/test_noise_export.py
    Orbitool/UI/tests/test_spectra_list_export.py
    Orbitool/UI/tests/test_calibration_table_export.py
    Orbitool/UI/tests/test_calibration_separate.py
    Orbitool/UI/tests/test_mass_defect_popup.py
    Orbitool/UI/tests/test_mass_list_compare.py
    Orbitool/UI/tests/test_peak_list_jump.py
    Orbitool/UI/test_spectra_timeseries_migration.py
    Orbitool/UI/test_calibration_migration.py
    Orbitool/UI/test_peakfit_migration.py
    Orbitool/UI/test_main_window_migration.py
    Orbitool/UI/manager/tests
    Orbitool/UI/file_tab
    Orbitool/UI/formulas
    Orbitool/utils/files/tests
    Orbitool/models/formula/tests
    Orbitool/utils/readers/tests
    Orbitool/utils/time_format
    Orbitool/models/calibration
    Orbitool/models/file/tests
    Orbitool/models/spectrum/tests
    Orbitool/models/peakfit/normal_distribution/tests
    Orbitool/models/peakfit/tests
    Orbitool/models/workspace/tests