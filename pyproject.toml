[project]
name = "orbitool"
version = "2.5.4"
requires-python = ">=3.11,<3.12"
dependencies = [
    "h5py==3.8.0",
    "matplotlib==3.7.2",
    "numpy==1.24.3",
    "packaging==23.1",
    "pydantic==2.4.2",
    "PyQt6==6.5.1",
    "pyqt6-qt6==6.5.1",
    "pyteomics==4.6",
    "pythonnet==3.0.1",
    "scipy==1.10.1",
    "sortedcontainers==2.4.0",
    "typing_extensions",
]

[dependency-groups]
dev = [
    "pytest==7.3.1",
    "pandas==2.0.1",
]
build = [
    "Cython==0.29.34",
    "pyinstaller==6.0.0",
]
