[project]
name = "orbitool"
version = "2.5.4"
requires-python = ">=3.14,<3.15"
dependencies = [
    "h5py==3.16.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "packaging==26.3",
    "pydantic==2.13.5",
    "PyQt6==6.11.0",
    "pyqt6-qt6==6.11.0",
    "pyteomics==5.0.1",
    "pythonnet==3.2.0",
    "scipy==1.18.1",
    "sortedcontainers==2.4.0",
    "typing_extensions",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pandas==3.0.6",
]
build = [
    "Cython==3.3.0",
    "pyinstaller==6.22.3",
]
